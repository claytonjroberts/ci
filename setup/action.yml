name: Setup
description: The toolchain every check runs with - uv, a pinned just, and optionally Node with pnpm.

inputs:
  python-version:
    description: Python for uv to install; empty uses the repo's .python-version or requires-python.
    default: ""
  sync:
    description: Command that installs the project's dependencies; empty skips it.
    default: uv sync --locked
  just-version:
    default: "1.58.0"
  node-version:
    description: Node to install; empty skips Node and pnpm.
    default: ""
  pnpm-dir:
    description: Directory whose package.json pins pnpm (packageManager) and holds pnpm-lock.yaml.
    default: .

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        python-version: ${{ inputs.python-version }}

    # By URL, not extractions/setup-just: that resolves versions through casey/just's releases list,
    # which GitHub has served empty.
    - name: Install just
      shell: bash
      env:
        VERSION: ${{ inputs.just-version }}
      run: |
        set -euo pipefail
        case "$RUNNER_ARCH" in X64) arch=x86_64 ;; ARM64) arch=aarch64 ;; esac
        case "$RUNNER_OS" in Linux) target="$arch-unknown-linux-musl" ;; macOS) target="$arch-apple-darwin" ;; esac
        dir="$RUNNER_TEMP/just-$VERSION"
        mkdir -p "$dir"
        curl -sSfL "https://github.com/casey/just/releases/download/$VERSION/just-$VERSION-$target.tar.gz" \
          | tar xz -C "$dir" just
        echo "$dir" >> "$GITHUB_PATH"

    - if: inputs.node-version != ''
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        package_json_file: ${{ inputs.pnpm-dir }}/package.json

    - if: inputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        # A self-hosted runner keeps its pnpm store warm; re-uploading it on every job only costs time.
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.pnpm-dir }}/pnpm-lock.yaml

    - if: inputs.sync != ''
      shell: bash
      run: ${{ inputs.sync }}
